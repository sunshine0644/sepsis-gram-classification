name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping website
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://sepsis-gram-classification-zghkkfdka9mq49n3bekw4g.streamlit.app)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "303" ]; then
            echo "✅ App is alive"
          else
            echo "⚠️ App returned $STATUS"
          fi
